name: WoodenSwordPlugin
version: '1.0.0'
main: com.example.woodensword.WoodenSwordPlugin
api-version: '1.21'
author: You
description: Gives OPs a special tracked Kill Sword that gains Sharpness on player kills.

commands:
  woodensword:
    description: Give yourself a special Kill Sword, optionally with a starting Sharpness level.
    usage: "/<command> [5|10|15|20|25|30|35]"
    permission: woodensword.use
    permission-message: "§cYou do not have permission to use /woodensword."

permissions:
  woodensword.use:
    description: Allows use of /woodensword
    default: op
